# ==============================================
# Azure DevOps Pipeline for Terraform (Linux Agent)
# Environments: DEV → UAT → PROD
# ==============================================

trigger: none

pool:
  name: IRM2
  demands:
  - Agent.Name -equals workagent3  # 👈 Make sure there are no tabs before this line

stages:
- stage: DEV
  displayName: "Deploy to DEV"
  variables:
    env: dev
  jobs:
  - job: DeployDev
    displayName: "Terraform Apply (DEV)"
    steps:
    - checkout: self

    - script: |
        echo "📁 Current directory:"
        pwd
        echo "📂 Files in repo:"
        ls -R
      displayName: "Debug: Verify GitHub checkout"

    - task: AzureCLI@2
      displayName: "Terraform Apply DEV"
      inputs:
        azureSubscription: 'RD-SP'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          echo "🚀 Deploying to DEV environment"
          echo "Using tfvars file: env/${env}.tfvars"
          cd terraform || cd .
          terraform init -input=false
          terraform plan -var-file="env/${env}.tfvars" -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan

- stage: UAT
  displayName: "Deploy to UAT"
  dependsOn: DEV
  condition: succeeded()
  variables:
    env: uat
  jobs:
  - job: DeployUat
    displayName: "Terraform Apply (UAT)"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Terraform Apply UAT"
      inputs:
        azureSubscription: 'RD-SP'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          echo "🚀 Deploying to UAT environment"
          echo "Using tfvars file: env/${env}.tfvars"
          cd terraform || cd .
          terraform init -input=false
          terraform plan -var-file="env/${env}.tfvars" -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan

- stage: PROD
  displayName: "Deploy to PROD"
  dependsOn: UAT
  condition: succeeded()
  variables:
    env: prod
  jobs:
  - job: DeployProd
    displayName: "Terraform Apply (PROD)"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Terraform Apply PROD"
      inputs:
        azureSubscription: 'RD-SP'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          echo "🚀 Deploying to PROD environment"
          echo "Using tfvars file: env/${env}.tfvars"
          cd terraform || cd .
          terraform init -input=false
          terraform plan -var-file="env/${env}.tfvars" -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan
