trigger: none

pool:
  vmImage: 'ubuntu-latest'

stages:
  - stage: DEV
    variables:
      - name: env
        value: 'dev'
    jobs:
      - job: DeployDev
        steps:
          - checkout: self
          - script: |
              terraform init
              terraform plan -var-file="env/$(env).tfvars" -out=tfplan
              terraform apply -auto-approve tfplan

  - stage: UAT
    dependsOn: DEV
    condition: succeeded()
    variables:
      - name: env
        value: 'uat'
    jobs:
      - job: DeployUat
        steps:
          - checkout: self
          - script: |
              terraform init
              terraform plan -var-file="env/$(env).tfvars" -out=tfplan
              terraform apply -auto-approve tfplan

  - stage: PROD
    dependsOn: UAT
    condition: succeeded()
    variables:
      - name: env
        value: 'prod'
    jobs:
      - job: DeployProd
        steps:
          - checkout: self
          - script: |
              terraform init
              terraform plan -var-file="env/$(env).tfvars" -out=tfplan
              terraform apply -auto-approve tfplan
