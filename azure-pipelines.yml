# ==========================================================
# Azure DevOps Pipeline for Terraform (Linux self-hosted)
# Environments: DEV → UAT → PROD
# Uses GitHub as repo source
# ==========================================================

trigger: none    # Manual trigger (change to branches if needed)

pool:
  name: IRM2
  demands:
  - Agent.Name -equals workagent3

stages:
# -------------------- DEV --------------------
- stage: DEV
  displayName: "Deploy to DEV"
  variables:
    env: dev
  jobs:
  - job: DeployDev
    displayName: "Terraform Apply (DEV)"
    steps:
    - checkout: self

    - script: |
        echo "📁 Current directory:"
        pwd
        echo "📂 Files in repo:"
        ls -R
      displayName: "Debug: Verify GitHub checkout"

    - task: AzureCLI@2
      displayName: "Terraform Apply DEV"
      inputs:
        azureSubscription: 'RD-SP'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          echo "🚀 Deploying to ${ENV} environment"
          echo "Using tfvars file: env/${ENV}.tfvars"

          # If Terraform files are at repo root (as your logs show), no cd needed
          terraform init -input=false
          terraform plan -var-file="env/${ENV}.tfvars" -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan

# -------------------- UAT --------------------
- stage: UAT
  displayName: "Deploy to UAT"
  dependsOn: DEV
  condition: succeeded()
  variables:
    env: uat
  jobs:
  - job: DeployUat
    displayName: "Terraform Apply (UAT)"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Terraform Apply UAT"
      inputs:
        azureSubscription: 'RD-SP'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          echo "🚀 Deploying to ${ENV} environment"
          echo "Using tfvars file: env/${ENV}.tfvars"
          terraform init -input=false
          terraform plan -var-file="env/${ENV}.tfvars" -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan

# -------------------- PROD --------------------
- stage: PROD
  displayName: "Deploy to PROD"
  dependsOn: UAT
  condition: succeeded()
  variables:
    env: prod
  jobs:
  - job: DeployProd
    displayName: "Terraform Apply (PROD)"
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Terraform Apply PROD"
      inputs:
        azureSubscription: 'RD-SP'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e
          echo "🚀 Deploying to ${ENV} environment"
          echo "Using tfvars file: env/${ENV}.tfvars"
          terraform init -input=false
          terraform plan -var-file="env/${ENV}.tfvars" -out=tfplan -input=false
          terraform apply -input=false -auto-approve tfplan
