trigger: none

pool:
  name: IRM2
  demands:
    - Agent.Name -equals Wordagent

stages:

  - stage: DEV
    displayName: "Deploy to DEV"
    variables:
      env: dev
    jobs:
      - job: DeployDev
        displayName: "Terraform DEV"
        steps:
          - checkout: self
          - task: CmdLine@2
            displayName: "Terraform Apply DEV"
            inputs:
              script: |
                echo Deploying to DEV environment
                terraform init
                terraform plan -var-file="env/$(env).tfvars" -out=tfplan -input=false
                terraform apply -input=false -auto-approve tfplan

  - stage: UAT
    displayName: "Deploy to UAT"
    dependsOn: DEV
    condition: succeeded()
    variables:
      env: uat
    jobs:
      - job: DeployUat
        displayName: "Terraform UAT"
        steps:
          - checkout: self
          - task: CmdLine@2
            displayName: "Terraform Apply UAT"
            inputs:
              script: |
                echo Deploying to UAT environment
                terraform init
                terraform plan -var-file="env/$(env).tfvars" -out=tfplan -input=false
                terraform apply -input=false -auto-approve tfplan

  - stage: PROD
    displayName: "Deploy to PROD"
    dependsOn: UAT
    condition: succeeded()
    variables:
      env: prod
    jobs:
      - job: DeployProd
        displayName: "Terraform PROD"
        steps:
          - checkout: self
          - task: CmdLine@2
            displayName: "Terraform Apply PROD"
            inputs:
              script: |
                echo Deploying to PROD environment
                terraform init
                terraform plan -var-file="env/$(env).tfvars" -out=tfplan -input=false
                terraform apply -input=false -auto-approve tfplan
