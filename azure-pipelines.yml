trigger: none

pool:
  name: IRM
  demands:
    - Agent.Name -equals Work

stages:

  - stage: DEV
    displayName: "Deploy to DEV"
    variables:
      env: dev
    jobs:
      - job: DeployDev
        displayName: "Terraform DEV"
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Terraform Apply DEV"
            inputs:
              targetType: 'inline'
              pwsh: false  # Use Windows PowerShell
              script: |
                # Import Security module to avoid ConvertTo-SecureString errors
                Import-Module Microsoft.PowerShell.Security -Force

                Write-Host "Deploying to DEV environment"
                terraform init
                terraform plan -var-file="env/$(env).tfvars" -out=tfplan -input=false
                terraform apply -input=false -auto-approve tfplan

  - stage: UAT
    displayName: "Deploy to UAT"
    dependsOn: DEV
    condition: succeeded()
    variables:
      env: uat
    jobs:
      - job: DeployUat
        displayName: "Terraform UAT"
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Terraform Apply UAT"
            inputs:
              targetType: 'inline'
              pwsh: false
              script: |
                Import-Module Microsoft.PowerShell.Security -Force
                Write-Host "Deploying to UAT environment"
                terraform init
                terraform plan -var-file="env/$(env).tfvars" -out=tfplan -input=false
                terraform apply -input=false -auto-approve tfplan

  - stage: PROD
    displayName: "Deploy to PROD"
    dependsOn: UAT
    condition: succeeded()
    variables:
      env: prod
    jobs:
      - job: DeployProd
        displayName: "Terraform PROD"
        steps:
          - checkout: self
          - task: PowerShell@2
            displayName: "Terraform Apply PROD"
            inputs:
              targetType: 'inline'
              pwsh: false
              script: |
                Import-Module Microsoft.PowerShell.Security -Force
                Write-Host "Deploying to PROD environment"
                terraform init
                terraform plan -var-file="env/$(env).tfvars" -out=tfplan -input=false
                terraform apply -input=false -auto-approve tfplan
